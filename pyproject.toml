[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dianyi"
version = "0.1.0.dev0"
description = "Offline English-to-Simplified-Chinese selection translator for X11"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Xiaohang Liu" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: GTK",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
dianyi = "dianyi.app:main"

[project.optional-dependencies]
translation = ["argostranslate==1.11.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
